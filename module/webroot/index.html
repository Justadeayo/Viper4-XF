<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Viper4-XF</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-app-bar">
    <div class="top-app-bar__title">
      <span class="top-app-bar__eyebrow">ViPER4Android RE</span>
      <h1>Viper4-XF</h1>
    </div>
    <div class="header-actions">
      <div class="status-chip" id="status">
        <span class="status-chip__dot" id="statusDot"></span>
        <span id="statusText">Checking driver…</span>
      </div>
      <button type="button" class="power-btn" id="powerBtn" aria-pressed="false" aria-label="Turn ViPER on or off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9" /><path d="M6.3 6.3a8 8 0 1 0 11.4 0" /></svg>
      </button>
    </div>
  </header>

  <main class="content">
    <div class="notice" id="notice" hidden>
      Open this page from the KernelSU manager to apply changes. In a browser it runs in preview mode.
    </div>

    <div id="sections" class="sections"></div>

    <section class="card" aria-labelledby="presetsTitle">
      <div class="card__header">
        <h2 id="presetsTitle">Presets</h2>
        <p class="card__desc">Saved on the device and restored after reboot.</p>
      </div>
      <div class="field-row">
        <label class="outlined-field">
          <input id="presetName" type="text" maxlength="32" placeholder=" " autocomplete="off" spellcheck="false" />
          <span class="outlined-field__label">Preset name</span>
        </label>
        <button class="button button--filled" id="presetSave">Save</button>
      </div>
      <ul class="preset-list" id="presetList"></ul>
    </section>

    <div class="card-actions">
      <button class="button button--text-danger" id="resetAll">Reset all</button>
    </div>

    <footer class="footer"><span id="footerInfo">Viper4-XF</span></footer>
  </main>

  <div class="snackbar" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>

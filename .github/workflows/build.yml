name: Build module

on:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      telegram:
        description: Send the zip to Telegram
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Fetch latest ViPERDSP
        run: git submodule update --init --remote --recursive

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake zip

      - name: Build boot daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: make daemon

      - name: Build flashable zip
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: make zip

      - uses: actions/upload-artifact@v4
        with:
          name: Viper4-XF
          path: out/*.zip
          
      - name: Send zip to Telegram
        if: ${{ inputs.telegram == null || inputs.telegram == true }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CAPTION=$(git log -1 --format=%s)
          for f in out/*.zip; do
            curl -sS -F "chat_id=${TG_CHAT_ID}" \
              -F "document=@${f}" \
              --form-string "caption=${CAPTION}" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"
          done
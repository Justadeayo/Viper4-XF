name: "Bug report"
description: "Report a problem with Viper4-XF (WebUI, driver or build)"
labels: ["bug"]
title: "[Bug] "
body:
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I checked the README troubleshooting section
          required: true
        - label: I confirmed my device is non-AIDL (the command in the README prints nothing)
          required: true
  - type: input
    attributes:
      label: Device and Android version
      placeholder: "e.g. Pixel 8 Pro, Android 14"
    validations:
      required: true
  - type: input
    attributes:
      label: Root manager and version
      placeholder: "e.g. KernelSU 1.x, Magisk 28"
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened
      description: What you expected, what happened instead, and the steps to reproduce.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Driver log
      description: "Paste the output of: su -c 'logcat -d -s ViPER4Android:*'"
      render: shell
    validations:
      required: true
